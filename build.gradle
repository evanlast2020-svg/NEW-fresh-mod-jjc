plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
group = mod_group_id
version = mod_version
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach { workingDirectory project.file('run'); property 'forge.logging.console.level', 'info'; mods { "${mod_id}" { source sourceSets.main } } }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id } 
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories { maven { url = 'https://maven.minecraftforge.net/' } }
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
def modMetadata = [
    mod_id: mod_id,
    mod_name: mod_name,
    mod_license: mod_license,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_description: mod_description,
    loader_version_range: loader_version_range,
    forge_version_range: forge_version_range,
    minecraft_version_range: minecraft_version_range
]
tasks.named('processResources', ProcessResources).configure {
    inputs.properties(modMetadata)
    filesMatching(['META-INF/mods.toml']) { expand(modMetadata) }
}
jar { manifest { attributes(['Specification-Title': mod_id, 'Specification-Vendor': mod_authors, 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion, 'Implementation-Vendor': mod_authors]) } }
