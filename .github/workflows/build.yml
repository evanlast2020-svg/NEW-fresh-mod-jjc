name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Forge mod
        run: bash ./gradlew --no-daemon build
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: jjcprogression-jar
          path: build/libs/*.jar
          if-no-files-found: error

